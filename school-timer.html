<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="description" content="分と秒のダイヤルで時間を合わせる、シンプルな学校用タイマー。">
  <title>学校タイマー</title>
  <style>
    :root { color-scheme: light; --ink:#182539; --muted:#65738a; --blue:#2563eb; --line:#dce3ee; --row:52px }
    * { box-sizing:border-box }
    body { margin:0; min-height:100svh; background:#f6f8fc; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif }
    button { font:inherit; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent }
    button:focus-visible,[tabindex]:focus-visible { outline:3px solid #2563eb; outline-offset:5px }
    button:disabled { opacity:.4; cursor:default }
    [hidden] { display:none !important }
    .app { width:min(660px,100%); min-height:100svh; margin:auto; padding:clamp(26px,6vh,64px) 24px 20px; display:flex; flex-direction:column; justify-content:center }
    .display { text-align:center }
    .time { color:#1d4ed8; font-size:clamp(78px,19vw,148px); line-height:1.1; letter-spacing:-.055em; font-weight:750; font-variant-numeric:tabular-nums }
    .time.urgent { color:#c25116 }
    .time.done { color:#c92b42 }
    .status { min-height:26px; margin:10px 0 22px; color:var(--muted); font-size:16px; font-weight:600 }
    .track { height:5px; border-radius:9px; background:#e1e7f1; overflow:hidden }
    .progress { height:100%; width:100%; background:var(--blue); border-radius:inherit; transition:width .12s linear }
    .controls { display:grid; grid-template-columns:1.7fr 1fr; gap:12px; margin-top:24px }
    .control { display:flex; align-items:center; justify-content:center; gap:10px; min-height:70px; padding:12px; border-radius:18px; font-size:20px; font-weight:700; border:1px solid transparent }
    .start { background:var(--blue); color:white; box-shadow:0 6px 16px #2563eb20 }
    .start:hover { background:#1d4ed8 }
    .reset { background:white; color:var(--ink); border-color:var(--line) }
    .reset:hover { background:#edf2f9 }
    .start.alarm { background:#c92b42 }
    svg { width:22px; height:22px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round }
    .time-picker { margin:28px auto 0; width:min(360px,100%) }
    .wheel-labels { display:grid; grid-template-columns:1fr 1fr; gap:28px; text-align:center; color:var(--muted); font-size:15px; font-weight:650; margin-bottom:8px }
    .wheels { display:grid; grid-template-columns:1fr 1fr; gap:28px }
    .wheel-frame { position:relative; min-width:0; isolation:isolate }
    .wheel-frame::before { content:""; position:absolute; z-index:-1; top:calc(var(--row)*2); left:0; right:0; height:var(--row); border-radius:12px; background:#e7eefc; border:1px solid #d2dff9 }
    .wheel { height:calc(var(--row)*5); padding:calc(var(--row)*2) 0; overflow-y:auto; overscroll-behavior-y:contain; scroll-snap-type:y mandatory; scrollbar-width:none; border-radius:14px; touch-action:pan-y; -webkit-overflow-scrolling:touch; mask-image:linear-gradient(transparent,#000 34%,#000 66%,transparent) }
    .wheel::-webkit-scrollbar { display:none }
    .wheel-value { height:var(--row); line-height:var(--row); scroll-snap-align:center; text-align:center; color:#73829a; font-size:30px; font-weight:550; font-variant-numeric:tabular-nums; user-select:none; cursor:ns-resize }
    .wheel-value.selected { color:#1745a2; font-weight:750; font-size:36px }
    .hint { margin:10px 0 0; text-align:center; color:var(--muted); font-size:13px }
    .running-adjust { margin:28px auto 0 }
    .add { background:#fff; border:1px solid var(--line); color:#1d4ed8; padding:13px 26px; border-radius:14px; min-height:52px; font-size:18px; font-weight:650 }
    .utilities { display:flex; justify-content:center; gap:24px; margin-top:26px }
    .utility { display:flex; align-items:center; gap:7px; min-height:44px; padding:8px; background:transparent; border:0; color:var(--muted); font-size:13px }
    .utility svg { width:18px; height:18px }
    .utility:hover { color:var(--blue) }
    .sound-note { margin:8px 0 0; text-align:center; color:#b92d40; font-size:13px }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0 }
    body.expanded .app { width:min(1200px,100%); padding:24px; }
    body.expanded .time { font-size:clamp(100px,25vw,310px) }
    body.expanded .time-picker { display:none }
    body.expanded .controls { width:min(660px,100%); align-self:center }
    body.expanded .status { font-size:22px }
    @media (max-width:420px) { .app { padding:28px 18px 16px } .control { min-height:64px; font-size:17px; gap:7px } .controls { gap:10px } .time-picker { margin-top:22px } }
    @media (max-height:740px) { :root { --row:44px } .app { padding-top:22px } .time { font-size:clamp(78px,17vw,124px) } .status { margin:6px 0 16px } .controls { margin-top:18px } .time-picker { margin-top:20px } .utilities { margin-top:16px } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important } }
  </style>
</head>
<body>
  <main class="app" aria-label="学校タイマー">
    <div class="display">
      <div id="timer" class="time" role="timer" aria-label="残り5分0秒">05:00</div>
      <p id="status" class="status" role="status"> </p>
      <div class="track" aria-hidden="true"><div id="progress" class="progress"></div></div>
    </div>

    <div class="controls">
      <button id="startPause" class="control start" type="button">
        <svg id="startIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7z"/></svg>
        <span id="startLabel">スタート</span>
      </button>
      <button id="reset" class="control reset" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg>
        リセット
      </button>
    </div>

    <div id="timePicker" class="time-picker" role="group" aria-label="設定時間">
      <div class="wheel-labels"><span id="minuteLabel">分</span><span id="secondLabel">秒</span></div>
      <div class="wheels">
        <div class="wheel-frame"><div id="minutes" class="wheel" role="spinbutton" tabindex="0" aria-labelledby="minuteLabel" aria-valuemin="0" aria-valuemax="999" aria-valuenow="5" aria-valuetext="5分" aria-describedby="wheelHint"></div></div>
        <div class="wheel-frame"><div id="seconds" class="wheel" role="spinbutton" tabindex="0" aria-labelledby="secondLabel" aria-valuemin="0" aria-valuemax="59" aria-valuenow="0" aria-valuetext="0秒" aria-describedby="wheelHint"></div></div>
      </div>
      <p id="wheelHint" class="hint">上下にスワイプして時間を調整</p>
    </div>

    <div id="runningAdjust" class="running-adjust" hidden><button id="addMinute" class="add" type="button">＋ 1分</button></div>

    <div class="utilities">
      <button id="soundTest" class="utility" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 4-6 5H2v6h3l6 5zM16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg>
        音を確認
      </button>
      <button id="focus" class="utility" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
        <span id="focusLabel">大きく表示</span>
      </button>
    </div>
    <p id="soundNote" class="sound-note" role="status" hidden></p>
  </main>

  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const MAX = 59999;
    let configured = 300, remainingMs = 300000, endAt = 0, running = false, finished = false;
    let ticker = 0, audioCtx = null, alarmSource = null, alarmGain = null, alarmActive = false;
    let testSource = null, wakeLock = null, wakeRequest = 0;
    const wheels = [];
    const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
    const fmt = n => String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    function persist() {
      try { localStorage.setItem('schoolTimerSimpleV1', String(configured)); } catch (_) {}
    }

    function render() {
      const seconds = Math.ceil(remainingMs / 1000);
      $('timer').textContent = fmt(seconds);
      $('timer').setAttribute('aria-label', `残り${Math.floor(seconds / 60)}分${seconds % 60}秒`);
      $('timer').classList.toggle('urgent', !finished && seconds > 0 && seconds <= 10);
      $('timer').classList.toggle('done', finished);
      $('progress').style.width = (configured ? clamp(remainingMs / (configured * 1000) * 100, 0, 100) : 0) + '%';
      $('startLabel').textContent = alarmActive ? '音を止める' : running ? '一時停止' : finished ? 'もう一度' : remainingMs < configured * 1000 ? 'つづける' : 'スタート';
      $('startIcon').innerHTML = alarmActive ? '<rect x="6" y="6" width="12" height="12" rx="1"/>' : running ? '<path d="M8 5v14M16 5v14"/>' : '<path d="m9 5 11 7-11 7z"/>';
      $('startPause').classList.toggle('alarm', alarmActive);
      $('startPause').disabled = configured === 0;
      const statusText = finished ? '時間です' : running ? '計測中' : remainingMs < configured * 1000 ? '一時停止中' : '\u00a0';
      if ($('status').textContent !== statusText) $('status').textContent = statusText;
      $('timePicker').hidden = running || finished;
      $('runningAdjust').hidden = !running;
      $('addMinute').disabled = configured >= MAX;
      $('soundTest').disabled = alarmActive;
      document.title = fmt(seconds) + '｜学校タイマー';
    }

    function createWheel(id, count, unit) {
      const el = $(id);
      const fragment = document.createDocumentFragment();
      for (let i = 0; i < count * 3; i++) {
        const row = document.createElement('div');
        row.className = 'wheel-value';
        row.textContent = String(i % count).padStart(2, '0');
        row.setAttribute('aria-hidden', 'true');
        fragment.appendChild(row);
      }
      el.appendChild(fragment);
      let settleId = 0, selected = null, frameId = 0, drag = null, dragged = false;
      const wheel = { el, count, value:0, set };
      function rowHeight() { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--row')); }
      function select(index) {
        index = clamp(index, 0, count * 3 - 1);
        if (selected !== el.children[index]) {
          selected?.classList.remove('selected');
          selected = el.children[index];
          selected.classList.add('selected');
        }
        wheel.value = index % count;
        el.setAttribute('aria-valuenow', wheel.value);
        el.setAttribute('aria-valuetext', wheel.value + unit);
      }
      function set(value) {
        clearTimeout(settleId);
        select(count + value);
        el.scrollTop = (count + value) * rowHeight();
      }
      function read() {
        if (running || finished || !el.getClientRects().length) return;
        select(Math.round(el.scrollTop / rowHeight()));
        const next = wheels[0].value * 60 + wheels[1].value;
        if (next !== configured) setTime(next, false);
      }
      function settle() {
        if (drag || running || finished || !el.getClientRects().length) return;
        read();
        const index = Math.round(el.scrollTop / rowHeight());
        if (index < count || index >= count * 2) set(wheel.value);
      }
      el.addEventListener('scroll', () => {
        cancelAnimationFrame(frameId);
        frameId = requestAnimationFrame(read);
        clearTimeout(settleId);
        settleId = setTimeout(settle, 180);
      }, { passive:true });
      el.addEventListener('scrollend', settle);
      el.addEventListener('pointerdown', event => {
        if (event.pointerType !== 'mouse' || event.button !== 0) return;
        drag = { y:event.clientY, top:el.scrollTop, id:event.pointerId };
        dragged = false;
      });
      el.addEventListener('pointermove', event => {
        if (!drag) return;
        const distance = drag.y - event.clientY;
        if (!dragged && Math.abs(distance) < 5) return;
        dragged = true;
        el.setPointerCapture(drag.id);
        el.style.scrollSnapType = 'none';
        el.scrollTop = drag.top + distance;
      });
      function endDrag() {
        if (!drag) return;
        const top = Math.round(el.scrollTop / rowHeight()) * rowHeight();
        drag = null;
        el.style.scrollSnapType = '';
        if (dragged) el.scrollTo({ top, behavior:reduceMotion ? 'instant' : 'smooth' });
      }
      el.addEventListener('pointerup', endDrag);
      el.addEventListener('pointercancel', endDrag);
      el.addEventListener('lostpointercapture', endDrag);
      el.addEventListener('pointerleave', () => { if (!dragged) drag = null; });
      el.addEventListener('click', event => {
        if (dragged) { dragged = false; return; }
        if (!event.target.classList.contains('wheel-value')) return;
        const index = Array.prototype.indexOf.call(el.children, event.target);
        el.scrollTo({ top:index * rowHeight(), behavior:reduceMotion ? 'instant' : 'smooth' });
      });
      el.addEventListener('keydown', event => {
        const increments = { ArrowUp:1, ArrowDown:-1, PageUp:10, PageDown:-10 };
        if (!(event.key in increments) && event.key !== 'Home' && event.key !== 'End') return;
        event.preventDefault();
        const value = event.key === 'Home' ? 0 : event.key === 'End' ? count - 1 : (wheel.value + increments[event.key] + count) % count;
        set(value);
        setTime(wheels[0].value * 60 + wheels[1].value, false);
      });
      wheels.push(wheel);
    }

    function syncWheels() {
      wheels[0].set(Math.floor(configured / 60));
      wheels[1].set(configured % 60);
    }

    function setTime(seconds, sync = true) {
      configured = clamp(Math.round(seconds), 0, MAX);
      remainingMs = configured * 1000;
      finished = false;
      render();
      if (sync) syncWheels();
      persist();
    }

    async function prepareAudio() {
      try {
        if (!audioCtx || audioCtx.state === 'closed') audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        await audioCtx.resume();
        if (audioCtx.state !== 'running') throw new Error('Audio unavailable');
        $('soundNote').hidden = true;
        return true;
      } catch (_) {
        $('soundNote').textContent = '音を再生できません。「音を確認」を押してください。';
        $('soundNote').hidden = false;
        return false;
      }
    }

    function makeAlarmSource(loop) {
      const duration = 1.8, rate = audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, Math.ceil(rate * duration), rate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        const t = i / rate, beat = Math.floor(t / .3), phase = t - beat * .3;
        if (beat >= 4 || phase >= .19) continue;
        const frequency = beat % 2 === 0 ? 880 : 1174;
        const envelope = Math.min(1, phase / .008, (.19 - phase) / .012);
        data[i] = .7 * envelope * (Math.sin(2 * Math.PI * frequency * phase) + .2 * Math.sin(4 * Math.PI * frequency * phase)) / 1.2;
      }
      const source = audioCtx.createBufferSource();
      const gain = audioCtx.createGain();
      gain.gain.value = .85;
      source.buffer = buffer;
      source.loop = loop;
      source.connect(gain).connect(audioCtx.destination);
      source.onended = () => { source.disconnect(); gain.disconnect(); };
      source.start();
      return { source, gain };
    }

    function stopSource(source) {
      if (!source) return;
      try { source.stop(); } catch (_) {}
    }

    function stopAlarm() {
      alarmActive = false;
      if (alarmGain && audioCtx) alarmGain.gain.setTargetAtTime(0, audioCtx.currentTime, .008);
      stopSource(alarmSource);
      alarmSource = alarmGain = null;
    }

    async function soundAlarm() {
      alarmActive = true;
      render();
      const ready = await prepareAudio();
      if (!ready || !alarmActive) return;
      stopSource(testSource);
      const sound = makeAlarmSource(true);
      alarmSource = sound.source;
      alarmGain = sound.gain;
    }

    async function holdScreen() {
      const request = ++wakeRequest;
      try {
        if (!navigator.wakeLock || document.visibilityState !== 'visible') return;
        const lock = await navigator.wakeLock.request('screen');
        if (!running || request !== wakeRequest) { await lock.release(); return; }
        wakeLock = lock;
      } catch (_) {}
    }

    function releaseScreen() {
      wakeRequest++;
      wakeLock?.release().catch(() => {});
      wakeLock = null;
    }

    function tick() {
      if (!running) return;
      remainingMs = Math.max(0, endAt - Date.now());
      if (remainingMs === 0) {
        clearInterval(ticker);
        running = false;
        finished = true;
        releaseScreen();
        void soundAlarm();
      }
      render();
    }

    function toggleTimer() {
      if (alarmActive) { stopAlarm(); render(); return; }
      if (running) {
        tick();
        if (!running) return;
        clearInterval(ticker);
        running = false;
        releaseScreen();
        render();
        requestAnimationFrame(syncWheels);
        return;
      }
      // Flush any unfinished wheel gesture before starting.
      if (!finished) {
        for (const wheel of wheels) {
          const row = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--row'));
          if (wheel.el.getClientRects().length) wheel.value = Math.round(wheel.el.scrollTop / row) % wheel.count;
        }
        const next = wheels[0].value * 60 + wheels[1].value;
        if (next !== configured) setTime(next);
      }
      if (!configured) return;
      void prepareAudio();
      stopSource(testSource);
      if (finished || remainingMs <= 0) remainingMs = configured * 1000;
      finished = false;
      endAt = Date.now() + remainingMs;
      running = true;
      ticker = setInterval(tick, 100);
      void holdScreen();
      tick();
    }

    function reset() {
      clearInterval(ticker);
      running = false;
      finished = false;
      stopAlarm();
      stopSource(testSource);
      releaseScreen();
      setTime(configured);
    }

    $('startPause').addEventListener('click', toggleTimer);
    $('reset').addEventListener('click', reset);
    $('addMinute').addEventListener('click', () => {
      if (!running) return;
      tick();
      if (!running) return;
      const extra = Math.min(60, MAX - configured);
      configured += extra;
      endAt += extra * 1000;
      persist();
      tick();
    });
    $('soundTest').addEventListener('click', async () => {
      if (alarmActive || !(await prepareAudio())) return;
      // The timer may finish while the audio context is resuming.
      if (alarmActive) return;
      stopSource(testSource);
      testSource = makeAlarmSource(false).source;
    });
    $('focus').addEventListener('click', () => {
      const expanded = document.body.classList.toggle('expanded');
      $('focus').setAttribute('aria-pressed', String(expanded));
      $('focusLabel').textContent = expanded ? '元の表示' : '大きく表示';
      if (!expanded && !running && !finished) requestAnimationFrame(syncWheels);
    });
    document.addEventListener('keydown', event => {
      if (event.repeat || event.ctrlKey || event.altKey || event.metaKey || event.target.closest('button,[role="spinbutton"]')) return;
      if (event.code === 'Space') { event.preventDefault(); toggleTimer(); }
      if (event.key.toLowerCase() === 'r') reset();
      if (event.key === 'Escape' && document.body.classList.contains('expanded')) $('focus').click();
    });
    document.addEventListener('visibilitychange', () => {
      if (running) tick();
      if (running && document.visibilityState === 'visible') void holdScreen();
    });
    window.addEventListener('resize', () => {
      if (!running && !finished) requestAnimationFrame(syncWheels);
    });

    try {
      const saved = localStorage.getItem('schoolTimerSimpleV1');
      const legacy = JSON.parse(localStorage.getItem('schoolTimerV2') || '{}');
      const seconds = saved !== null ? Number(saved) : Number(legacy.seconds);
      if (Number.isFinite(seconds)) configured = clamp(Math.round(seconds), 0, MAX);
    } catch (_) {}
    createWheel('minutes', 1000, '分');
    createWheel('seconds', 60, '秒');
    setTime(configured);
  </script>
</body>
</html>
